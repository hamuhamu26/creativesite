<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PURIN CREATIVE STUDIO</title>
  
  <!-- Google Fontsから「読みやすい丸ゴシック」と「可愛いドットフォント」を読み込む -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-navy: #142130;       /* 深いネイビー */
      --card-navy: #1C2D42;     /* カード背景 */
      --cocoa-brown: #6D4C41;   /* ココアブラウン */
      --light-wood: #DFC29B;    /* 明るい木材 */
      --wood-dark: #C69C6D;     /* 木材の影色 */
      --text-main: #F5F5F7;     /* 優しい白文字 */
      --text-sub: #B0BEC5;      /* サブ文字 */
    }

    body {
      background-color: var(--bg-navy);
      color: var(--text-main);
      font-family: 'Zen Maru Gothic', sans-serif;
      padding: 40px 20px;
      line-height: 2;
    }

    .pixel-title {
      font-family: 'DotGothic16', sans-serif;
      letter-spacing: 0.08em;
    }

    .cocoa-card {
      max-width: 650px;
      margin: 0 auto;
      background-color: var(--cocoa-brown);
      border: 3px solid var(--light-wood); /* 明るい木材の枠も足してみたよ！ */
      border-radius: 20px;
      padding: 25px;
    }
  </style>
</head>
<body>

  <!-- ④ 最初の </div> を消して、中身を全部カードの中に入れる！ -->
  <div class="cocoa-card">
    <h2 class="pixel-title">🍮 PURIN CREATIVE STUDIO</h2> 
      
    <h2>自己紹介</h2>
    <p>僕は、工業高校のクリエイターです。<br>
    ふわふわしていて優しい実用的なアプリやソフトを作ります〜！</p>
  </div>

</body>
</html>
